<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="keywords"
        content="Agentic SIEM, Agentic SecOps, Rover SIEM, S3 SIEM, S3 indices, adaptive detections, signals to cases, security search, SIEM cost reduction, autonomous triage, detection engineering, threat hunting">
    <link rel="canonical" href="https://roverhq.ai{{ page.url | replace: 'index.html', '' }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://roverhq.ai{{ page.url | replace: 'index.html', '' }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="{{ page.og_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://roverhq.ai{{ page.url | replace: 'index.html', '' }}">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.description }}">
    <meta name="twitter:image" content="{{ page.og_image }}">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Rover",
        "operatingSystem": "Cloud-native",
        "applicationCategory": "SecurityApplication",
        "description": "Agentic SIEM with adaptive detections, signals-to-cases investigation, agent-assisted SecOps, S3-native search, S3-hosted indices, autonomous triage, and incident response readiness.",
        "offers": {
            "@type": "Offer",
            "priceCurrency": "USD",
            "availability": "https://schema.org/PreOrder"
        }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS v4 Browser Runtime -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/new_layout.css' | relative_url }}">
    <link rel="stylesheet" href="./new_layout.css">

    <!-- Favicon Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
    <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}">
</head>

<body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-foreground">
    <nav class="sticky top-0 z-50 border-b border-border bg-background/95 backdrop-blur-lg text-foreground"
        aria-label="Main navigation">
        <div class="shell flex h-18 items-center justify-between gap-4">
            <a href="/"
                class="flex items-center gap-2.5 font-bold tracking-tight text-foreground transition-opacity hover:opacity-90"
                aria-label="Rover home">
                <span
                    class="flex h-9 w-9 items-center justify-center rounded-md bg-foreground font-mono text-sm font-bold text-background shadow-sm">R</span>
                <span class="text-lg font-semibold tracking-tight text-foreground">Rover</span>
            </a>

            <div class="hidden items-center gap-7 text-xs font-semibold uppercase tracking-wider  md:flex"
                aria-label="Page sections">
                <a href="/#search" class="transition-colors hover:text-foreground">Search</a>
                <a href="/#analytics" class="transition-colors hover:text-foreground">Analytics</a>
                <a href="/#architecture" class="transition-colors hover:text-foreground">Architecture</a>
                <a href="/#ai-soc" class="transition-colors hover:text-foreground">AI SOC</a>
                <a href="/blogs/" class="transition-colors hover:text-foreground">Blogs</a>
            </div>

            <div class="flex items-center gap-3">
                <a class="px-4 py-2 text-xs font-semibold rounded-md border border-border bg-surface-1 text-foreground hover:bg-surface-2 transition-colors"
                    href="/#hero-preview">See Rover in Action</a>
                <a class="px-4 py-2 text-xs font-semibold rounded-md bg-primary text-primary-foreground hover:bg-primary/90 transition-colors"
                    href="/#early-access">Get Demo</a>
            </div>
        </div>
    </nav>

    {{ content }}

    <footer class="border-t border-border bg-background py-12 text-sm ">
        <div class="shell flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
            <div>&copy; 2026 Rover HQ Inc. All rights reserved.</div>
            <div class="flex flex-wrap items-center gap-6 font-medium">
                <a href="mailto:contactus@roverhq.ai"
                    class="transition-colors hover:text-foreground">contactus@roverhq.ai</a>
                <a href="https://www.linkedin.com/company/rover-hq-ai/" target="_blank" rel="noopener noreferrer"
                    class="transition-colors hover:text-foreground">LinkedIn</a>
                <a href="#" class="transition-colors hover:text-foreground">Privacy</a>
                <a href="#" class="transition-colors hover:text-foreground">Terms</a>
                <a href="/blogs/" class="transition-colors hover:text-foreground">Blogs</a>
            </div>
        </div>
    </footer>

    <!-- Relative path for site.js -->
    <script src="{{ '/site.js' | relative_url }}"></script>
</body>

</html>
