name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Branch publishing also runs Jekyll, which can overwrite this app with the README.
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! pages_build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"; then
            echo "::error::Could not verify GitHub Pages settings. Check the API error above."
            exit 1
          fi
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow. Publishing from a branch can overwrite the app with the README."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit app
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-VEBTYNJ650
          PUBLIC_CLARITY_PROJECT_ID: y9eljhvrmn

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # This is the default output directory for adapter-static
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
